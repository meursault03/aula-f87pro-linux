[package]
name = "aula-f87pro"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native Linux lighting, key assignments and profiles for the AULA F87 Pro"
license = "MIT"
readme = "README.md"
repository = "https://github.com/meursault03/aula-f87pro-linux"
keywords = ["aula", "keyboard", "hid", "rgb", "linux"]
categories = ["hardware-support", "gui"]
default-run = "aula-f87pro"
include = ["/src/**", "/tests/*.py", "/tests/fixtures/**", "/packaging/*.py", "/packaging/*.md", "/packaging/arch/*.in", "/packaging/share/**", "/scripts/*.py", "/scripts/*.sh", "/assets/**", "/packaging/*.txt", "/Cargo.toml", "/Cargo.lock", "/README.md", "/README.pt.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md"]

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
gui = ["dep:gtk"]

[[bin]]
name = "aula-f87pro"
path = "src/main.rs"

[[bin]]
name = "aula-f87pro-gui"
path = "src/gui.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
strip = "debuginfo"
